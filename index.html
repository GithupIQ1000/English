<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ghi dữ liệu vào GitHub</title>
</head>
<body>
  <h3>Upload JSON dữ liệu từ MySQL</h3>
  <input type="file" id="jsonFile" accept=".json">
  <button onclick="importJSON()">Nhập dữ liệu</button>
  <button onclick="debugShowAllWords()">Show dữ liệu</button>
  <div id="import-result" style="margin-top:10px;color:green;font-weight:bold"></div>



<div style="display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; height: 100vh;">
    <div id="word"></div>
    <div id="answer"></div>

    <div style="display: flex; gap: 10px;">
        <button class="learn" onclick="nextWord()">Next</button>
        <button class="learn" onclick="backWord()">Back</button>
    </div>

    <button onclick="if(confirm('Bạn có chắc muốn về trang chủ?')) location.href='index.html';">
        Quay lại
    </button>
</div>


  <div id="debug-output" 
       style="white-space:pre-wrap; padding:10px; border:1px solid #000; margin-top:20px;">
  </div>
<script>
let db;   // 👈 PHẢI CÓ

const request = indexedDB.open("MyDB", 1);

request.onupgradeneeded = function (e) {
    const db = e.target.result;

    // Tạo objectStore nếu chưa tồn tại
    if (!db.objectStoreNames.contains("words")) {
        const store = db.createObjectStore("words", {
            keyPath: "key"
        });

        store.createIndex("word", "word");
        store.createIndex("type", "type");
        store.createIndex("mean", "mean");
        store.createIndex("next_reading_time", "next_reading_time")
    }
};

request.onsuccess = function (e) {
    db = e.target.result;
    console.log("IndexedDB Ready");
    debugShowAllWords();
};

request.onerror = function (e) {
    console.error("IndexedDB Error:", e);
};



// =========================================
// LẤY NGÀY HIỆN TẠI (YYYY-MM-DD)
// =========================================
function today() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}


// -----------------------------
// IMPORT JSON
// -----------------------------
function importJSON() {
    const fileInput = document.getElementById("jsonFile");
    if (fileInput.files.length === 0) {
        alert("Chọn file JSON trước");
        return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function (e) {
        try {
            const data = JSON.parse(e.target.result);

            const tableObj = data.find(
                item => item.type === "table" && item.name === "words"
            );

            if (!tableObj) {
                alert("Không tìm thấy bảng words trong JSON!");
                return;
            }

            saveWordsToIndexedDB(tableObj.data);

        } catch (err) {
            console.error(err);
            alert("File JSON không hợp lệ!");
        }
    };

    reader.readAsText(file);
}



// -----------------------------
// SAVE DATA FROM JSON
// -----------------------------
function saveWordsToIndexedDB(words) {
    const tx = db.transaction("words", "readwrite");
    const store = tx.objectStore("words");

    let count = 0;

    words.forEach(w => {
        const key = `${w.word}|${w.type}|${w.mean}`;

        const item = {
            key: key,
            word: w.word,
            type: w.type,
            mean: w.mean,

            sum_point_reading: Number(w.sum_point_reading || 0),
            sum_point_speaking: Number(w.sum_point_speaking || 0),

            next_reading_time: w.next_reading_time,
            next_speaking_time: w.next_speaking_time
        };

        store.put(item);
        count++;
    });

    tx.oncomplete = function () {
        document.getElementById("import-result").innerText =
            `Đã nhập ${count} từ vào IndexedDB!`;
    };
}



// -----------------------------
// ADD NEW WORD MANUALLY
// -----------------------------
function addWord(word, type, mean) {

    const tx = db.transaction("words", "readwrite");
    const store = tx.objectStore("words");

    const isoDate = today();
        
    const record = {
        key: `${word}|${type}|${mean}`,
        word: word,
        type: type,
        mean: mean,
        sum_point_reading: 0,
        sum_point_speaking: 0,
        next_reading_time: isoDate,
        next_speaking_time: isoDate
    };

    store.add(record);
}


// =========================================
// OPEN DATABASE
// =========================================
let db;

const request = indexedDB.open("MyDB", 1);

request.onupgradeneeded = function (e) {
    const db = e.target.result;

    if (!db.objectStoreNames.contains("words")) {
        const store = db.createObjectStore("words", { keyPath: "key" });

        store.createIndex("word", "word");
        store.createIndex("type", "type");
        store.createIndex("mean", "mean");
        store.createIndex("next_reading_time", "next_reading_time");
    }
};

request.onsuccess = function (e) {
    db = e.target.result;
    loadWordsForToday();
};

request.onerror = function () {
    alert("Lỗi mở IndexedDB");
};



// =========================================
// TẢI TOÀN BỘ WORDS → LỌC THEO next_reading_time
// =========================================
let words = [];
let count = -1;  
let end_count = 0;

function loadWordsForToday() {
    const tx = db.transaction("words", "readonly");
    const store = tx.objectStore("words");
    const req = store.getAll();

    req.onsuccess = function () {
        const all = req.result;

        const todayDate = today();

        // LỌC: today >= next_reading_time
        words = all.filter(w => todayDate >= w.next_reading_time);
        words.sort((a, b) => a.sum_point_reading - b.sum_point_reading);
        callback(words);
        if (words.length === 0) {
            document.getElementById("word").innerHTML =
                "Hôm nay không có readings nào.";
            document.querySelectorAll(".learn").forEach(btn => btn.style.display = "none");
            return;
        }

        end_count = words.length;
        count = -1;
        nextWord();
    };
}


// =========================================
// NEXT WORD
// =========================================
function nextWord() {
    count++;

    if (count >= end_count) {
        count = end_count;

        document.getElementById("word").innerHTML =
            "Bạn đã hoàn thành readings ngày hôm nay.";

        document.getElementById("answer").innerHTML = "";
        document.querySelectorAll(".learn").forEach(btn => btn.style.display = "none");

        return;
    }

    if (words[count].status === undefined) {
        words[count].status = -1;
    }

    showWord();
}


// =========================================
// BACK WORD
// =========================================
function backWord() {
    count--;

    if (count < 0) {
        count = 0;
    }

    showWord();
}


// =========================================
// HIỆN WORD
// =========================================
function showWord() {
    const w = words[count];

    let color = "black";
    if (w.status === 1) color = "green";
    if (w.status === 0) color = "red";

    document.getElementById("word").innerHTML = `
        <div id="sentence" style="color:${color}; font-size:35px;">
            ${w.word}
        </div>
        <button onclick="answer()">Answer</button>
    `;

    if (w.status === -1) {
        document.getElementById("answer").innerHTML =
            `<button onclick="markNx()">x N_point</button>`;
    } else {
        showFullCard();
    }
}


// =========================================
// TRẢ LỜI → HIỆN TYPE → HIỆN ĐẦY ĐỦ
// =========================================
function answer() {
    const w = words[count];

    const short = `<div>( ${w.type} )</div>`;

    const ansBox = document.getElementById("answer");

    if (ansBox.innerHTML.trim() === "" ||
        ansBox.innerHTML.includes("x N_point")) {
        ansBox.innerHTML = short;
        return;
    }

    if (ansBox.innerHTML.trim() === short.trim()) {
        showFullCard();
        return;
    }

    ansBox.innerHTML = "";
}


// =========================================
// HIỆN THẺ ĐẦY ĐỦ + OK / FORGET
// =========================================
function showFullCard() {
    const w = words[count];

    document.getElementById("answer").innerHTML = `
        <div>
            <div>${w.word}</div>
            <div>${w.word} (${w.type}): ${w.mean}</div>
        </div>
        <div>
            <button onclick="mark(1)">Ok</button>
            <button onclick="mark(0)">Forget</button>
        </div>
    `;
}


// =========================================
// X N_POINT
// =========================================
function markNx() {
    words[count].Nx_points = 1;
    document.getElementById("answer").innerHTML = "";
}


// =========================================
// MARK OK / FORGET
// =========================================
function mark(status) {
    const w = words[count];
    w.status = status;

    if (status === 1) document.getElementById("sentence").style.color = "green";
    if (status === 0) document.getElementById("sentence").style.color = "red";

    if (status === 1) {
        setTimeout(nextWord, 800);
    }
}


// -----------------------------
// DEBUG – SHOW ALL WORDS
// -----------------------------
function debugShowAllWords() {
    const tx = db.transaction("words", "readonly");
    const store = tx.objectStore("words");

    const req = store.getAll();

    req.onsuccess = function () {
        const data = req.result;

        if (data.length === 0) {
            document.getElementById("debug-output").innerHTML =
                "<b>IndexedDB trống!</b>";
            return;
        }

        let html = `
            <table border="1" cellpadding="5" style="border-collapse:collapse; width:100%;">
                <tr style="background:#eee;">
                    <th>Word</th>
                    <th>Type</th>
                    <th>Mean</th>
                    <th>Reading Point</th>
                    <th>Speaking Point</th>
                    <th>Next Reading</th>
                    <th>Next Speaking</th>
                </tr>
        `;

        data.forEach(item => {
            html += `
                <tr>
                    <td>${item.word}</td>
                    <td>${item.type}</td>
                    <td>${item.mean}</td>
                    <td>${item.sum_point_reading}</td>
                    <td>${item.sum_point_speaking}</td>
                    <td>${item.next_reading_time}</td>
                    <td>${item.next_speaking_time}</td>
                </tr>
            `;
        });

        html += "</table>";

        document.getElementById("debug-output").innerHTML = html;
    };
}
</script>
</body>
</html>
